# Copy this file to values-secrets.yaml (git-ignored, like .env) and fill in the values, then
# pass it to every install/upgrade with -f:
#
#   helm upgrade --install air-pollution helm/breezi -n air-pollution --create-namespace -f helm/breezi/values-secrets.yaml
#
# The chart turns these into the Secret "pollution-secrets"; each pod is handed only the keys
# it needs. Installing without the two required ones fails at once with a message naming them.
secrets:
  # PostgreSQL password of postgres.user (required). The database is created with it on first
  # start, and the writer and the API service log in with it.
  postgresPassword: ""
  # PurpleAir read keys, comma-separated (required: the collector fails at startup without one).
  purpleAirApiKeys: ""
  # Telegram delivery (both or neither; leave both empty to only log alerts).
  telegramBotToken: ""
  telegramChatId: ""
