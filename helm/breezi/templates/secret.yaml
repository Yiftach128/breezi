# The secrets, from values-secrets.yaml (see values-secrets.example.yaml). Each pod is handed
# only the keys it needs, by name, in its Deployment. The Telegram keys exist only when set,
# so an alert service without them only logs, as it does without the variables locally.
apiVersion: v1
kind: Secret
metadata:
  name: pollution-secrets
  labels:
    app.kubernetes.io/name: pollution-secrets
    {{- include "breezi.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (put it in values-secrets.yaml, see values-secrets.example.yaml)" .Values.secrets.postgresPassword | quote }}
  PURPLEAIR_API_KEYS: {{ required "secrets.purpleAirApiKeys is required (put it in values-secrets.yaml, see values-secrets.example.yaml)" .Values.secrets.purpleAirApiKeys | quote }}
  {{- with .Values.secrets.telegramBotToken }}
  TELEGRAM_BOT_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.telegramChatId }}
  TELEGRAM_CHAT_ID: {{ . | quote }}
  {{- end }}
