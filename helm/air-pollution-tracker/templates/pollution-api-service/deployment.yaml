# The API service: the dashboard and its JSON API, the one service with a Service, since it is
# the one thing anything outside the cluster talks to. It binds to every interface of the pod
# (the default, 127.0.0.1, would be reachable from inside the container only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pollution-api-service
  labels:
    app.kubernetes.io/name: pollution-api-service
    {{- include "apt.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pollution-api-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pollution-api-service
        {{- include "apt.commonLabels" . | nindent 8 }}
      annotations:
        {{- include "apt.checksumAnnotations" . | nindent 8 }}
    spec:
      # No Docker-link variables for the Services in the namespace: with them, a Service named kafka
      # gives every pod KAFKA_PORT=tcp://<ip>:9092, shadowing the numeric KAFKA_PORT the services read
      # (likewise REDIS_PORT and POSTGRES_PORT). DNS by Service name is all they need.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: pollution-api-service
          image: {{ .Values.image.repository }}/pollution-api-service:{{ .Values.image.tag }}
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: {{ .Values.healthPort }}
          envFrom:
            - configMapRef:
                name: pollution-config
          env:
            - name: API_BIND_ADDRESS
              value: 0.0.0.0
            - name: API_PORT
              value: "8080"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pollution-secrets
                  key: POSTGRES_PASSWORD
          {{- include "apt.healthProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.apiService.resources | nindent 12 }}
