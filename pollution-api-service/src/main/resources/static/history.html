<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>History — Breezi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="page-header">
    <a class="brand" href="/"><img src="/logo.svg" alt="Breezi"></a>
  </header>

  <div id="error" class="error" role="alert" hidden></div>

  <main>
    <nav class="crumbs"><a href="/">&lsaquo; All sensors</a></nav>

    <section class="section">
      <div id="source" class="source-slot"></div>
    </section>

    <section id="history" class="section" hidden>
      <div class="section-header">
        <h2>History</h2>
        <span id="history-status" class="muted"></span>
      </div>
      <div class="controls">
        <label>Range
          <select id="range">
            <option value="24">last 24 hours</option>
            <option value="48">last 48 hours</option>
            <option value="168">last 7 days</option>
            <option value="720">last 30 days</option>
            <option value="8760">last year</option>
            <option value="custom">custom</option>
          </select>
        </label>
        <span id="custom-range" class="custom-range" hidden>
          <label>from <input type="date" id="from"></label>
          <label>to <input type="date" id="to"></label>
        </span>
      </div>
      <div id="charts" class="charts"></div>
    </section>
  </main>

  <script src="/vendor/chart.umd.js"></script>
  <script type="module" src="/history.js"></script>
</body>
</html>
